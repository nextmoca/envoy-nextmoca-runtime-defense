apiVersion: apps/v1
kind: Deployment
metadata:
  name: hosted-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hosted-mock
  template:
    metadata:
      labels:
        app: hosted-mock
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: hosted-mock
          image: nextmoca/e2e-tools:local
          imagePullPolicy: Never
          command: ["/mock-nextmoca", "-listen", ":8081"]
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: hosted-mock
spec:
  selector:
    app: hosted-mock
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provider-mock
  template:
    metadata:
      labels:
        app: provider-mock
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: provider-mock
          image: nextmoca/e2e-tools:local
          imagePullPolicy: Never
          command: ["/mock-provider", "-listen", ":8082"]
          ports:
            - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: provider-mock
spec:
  selector:
    app: provider-mock
  ports:
    - name: http
      port: 8080
      targetPort: 8082
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-e2e
  template:
    metadata:
      labels:
        app: agent-e2e
    spec:
      containers:
        - name: agent
          image: curlimages/curl:8.16.0
          command: ["sh", "-c", "sleep 3600"]
