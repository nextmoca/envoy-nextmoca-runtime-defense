apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextmoca-envoy-extproc
  labels:
    app.kubernetes.io/name: nextmoca-envoy-extproc
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nextmoca-envoy-extproc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextmoca-envoy-extproc
    spec:
      containers:
        - name: bridge
          # Build from this public repository or replace with your approved registry image.
          image: REPLACE_WITH_PUBLISHED_BRIDGE_IMAGE
          imagePullPolicy: IfNotPresent
          env:
            - name: NEXTMOCA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nextmoca-envoy-extproc
                  key: api-key
            - name: NEXTMOCA_ENDPOINT
              value: https://api.nextmoca.com
            - name: NEXTMOCA_MODE
              value: quarantine
            - name: NEXTMOCA_REQUEST_ADAPTER
              value: openai_chat
            - name: NEXTMOCA_UNSUPPORTED_SHAPE
              value: block
            - name: NEXTMOCA_ON_SELECTION_ERROR
              value: block
            - name: NEXTMOCA_MAX_CONTEXT_TOKENS
              value: "8192"
            - name: NEXTMOCA_CAPACITY_TOKENS
              value: "128000"
          ports:
            - name: grpc
              containerPort: 9002
            - name: health
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: nextmoca-envoy-extproc
spec:
  selector:
    app.kubernetes.io/name: nextmoca-envoy-extproc
  ports:
    - name: grpc
      port: 9002
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
    - name: health
      port: 8080
      targetPort: health
