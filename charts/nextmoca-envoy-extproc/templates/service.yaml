apiVersion: v1
kind: Service
metadata:
  name: {{ include "nextmoca-envoy-extproc.fullname" . }}
  labels:
    {{- include "nextmoca-envoy-extproc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "nextmoca-envoy-extproc.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      appProtocol: kubernetes.io/h2c
    - name: health
      port: {{ .Values.service.healthPort }}
      targetPort: health
      protocol: TCP
