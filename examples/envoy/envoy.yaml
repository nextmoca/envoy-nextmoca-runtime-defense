# Replace the two cluster DNS names and the provider route with your own
# service discovery. This configuration scopes Next Moca to /v1/* traffic.
static_resources:
  listeners:
    - name: ai-provider-listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: nextmoca_ai_provider
                codec_type: AUTO
                route_config:
                  name: provider-routes
                  virtual_hosts:
                    - name: model-provider
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: /v1/
                          route:
                            cluster: model_provider
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: nextmoca_extproc
                        timeout: 3s
                      processing_mode:
                        request_header_mode: SEND
                        request_body_mode: BUFFERED
                        response_header_mode: SKIP
                        response_body_mode: NONE
                      message_timeout: 3s
                      failure_mode_allow: false
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: nextmoca_extproc
      type: STRICT_DNS
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: nextmoca_extproc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: nextmoca-envoy-extproc.default.svc.cluster.local
                      port_value: 9002
    - name: model_provider
      type: STRICT_DNS
      connect_timeout: 3s
      load_assignment:
        cluster_name: model_provider
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: model-provider.default.svc.cluster.local
                      port_value: 8080
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
