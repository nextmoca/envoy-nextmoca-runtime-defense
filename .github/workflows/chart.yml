name: Validate and release Helm chart

on:
  pull_request:
    paths:
      - "charts/**"
      - "examples/**"
      - "scripts/test-chart.sh"
      - "scripts/test-examples.sh"
      - "scripts/test-workflows.sh"
      - ".github/workflows/chart.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "examples/**"
      - "scripts/test-chart.sh"
      - "scripts/test-examples.sh"
      - "scripts/test-workflows.sh"
      - ".github/workflows/chart.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate chart and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint and render chart
        run: make chart-lint chart-test

      - name: Validate deployment examples
        run: ./scripts/test-examples.sh

  publish:
    name: Publish OCI Helm chart
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - name: Package and publish chart
        id: chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package charts/nextmoca-envoy-extproc --version "$VERSION" --app-version "$VERSION" --destination dist
          CHART="dist/nextmoca-envoy-extproc-${VERSION}.tgz"
          helm push "$CHART" oci://ghcr.io/nextmoca/charts
          echo "reference=ghcr.io/nextmoca/charts/nextmoca-envoy-extproc:${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Sign chart artifact
        run: cosign sign --yes "${{ steps.chart.outputs.reference }}"
